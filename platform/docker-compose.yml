# Atlas — local infrastructure: SQL Server, Seq and Azurite.
#
# Based on the compose file supplied with the task, with three changes:
#   - `name: atlas`, so containers and volumes don't clash with other projects
#     whose folder is also called "platform".
#   - SEQ_FIRSTRUN_NOAUTHENTICATION, because current datalust/seq:latest images
#     refuse to start without either an admin password or this opt-out. This is a
#     local log sink with no credentials, as the task's platform README describes.
#   - Azurite (blob service only), from the task's allowed list, for document
#     images. See docs/reasoning.md.
#
#   docker compose up -d --wait
#
# Host ports are overridable, because 1433 is very often already taken:
#   SQL_PORT=14330 SEQ_PORT=5342 BLOB_PORT=10010 docker compose up -d --wait
# The services read the same three variables.

name: atlas

services:

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_Dev_Password_1"
      MSSQL_PID: "Developer"
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "${SEQ_PORT:-5341}:80"
    volumes:
      - seq-data:/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    # --skipApiVersionCheck: Azurite rejects storage API versions newer than it
    # knows, which a newer Azure.Storage.Blobs package can send.
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--location", "/data", "--skipApiVersionCheck"]
    ports:
      - "${BLOB_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  sql-data:
  seq-data:
  azurite-data:
